<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars Player - V7.9 Pro</title>
    <style>
        
        :root { --bg: #121212; --card: #181818; --primary: #1db954; --text: #ffffff; --sub: #b3b3b3; --hover: #282828; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        
        .container { max-width: 800px; margin: 0 auto; }

        /* Auth Banner */
        .auth-banner { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--card); padding: 12px 20px; border-radius: 30px; 
            margin-bottom: 25px; border: 1px solid #333; 
        }
        .auth-status-info { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #666; transition: 0.3s; }
        .status-dot.online { background: var(--primary); box-shadow: 0 0 8px var(--primary); }
        .status-dot.offline { background: #ff4444; }
        #user-info { font-size: 0.9em; font-weight: 500; }
        .auth-btn { 
            background: var(--primary); color: black; border: none; padding: 8px 18px; 
            border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85em; transition: 0.2s;
        }
        .auth-btn:hover { transform: scale(1.05); }

        /* Dashboard & Grid */
        .dashboard { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .schedule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 10px; }
        .slot-control label { display: block; color: var(--sub); font-size: 0.85em; margin-bottom: 8px; font-weight: bold; }
        select { width: 100%; padding: 8px; background: #333; border: 1px solid #555; color: white; border-radius: 6px; cursor: pointer; }
        .btn-save { background: #333; color: white; border: 1px solid #555; padding: 10px 15px; border-radius: 20px; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.2s; font-weight: bold; }
        .btn-save:hover { background: #444; }

        /* Quick Switch */
        .quick-switch { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .mode-btn { 
            flex: 1; padding: 12px; border: none; border-radius: 8px; 
            background: var(--card); color: var(--sub); font-weight: bold; cursor: pointer; 
            transition: all 0.2s; border: 1px solid transparent; min-width: 80px;
        }
        .mode-btn:hover { background: var(--hover); color: white; }
        .mode-btn.active { background: var(--primary); color: black; box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3); }

        /* Track List */
        .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status-text { color: var(--primary); font-weight: bold; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        .track-list { display: flex; flex-direction: column; gap: 10px; }
        .track-card { 
            background: var(--card); padding: 12px; border-radius: 8px; display: flex; align-items: center; 
            transition: all 0.3s ease; border-left: 4px solid transparent; 
        }
        .track-card:hover { background: var(--hover); border-left-color: var(--primary); }
        
        .album-art { width: 50px; height: 50px; border-radius: 4px; margin-right: 15px; object-fit: cover; }
        .track-info { flex-grow: 1; min-width: 0; }
        .track-title { font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { color: var(--sub); font-size: 0.85em; }
        
        .actions { display: flex; gap: 8px; }
        .action-btn { 
            background: rgba(255,255,255,0.1); border: none; color: white; width: 36px; height: 36px; 
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .action-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        .btn-like.liked { color: #ff4081 !important; 
                          background: rgba(255, 64, 129, 0.2);
                          box-shadow: 0 0 12px rgba(255, 64, 129, 0.5);
                          transform: scale(1.1); }
        .btn-play { background: var(--primary); color: black; }
        
        /* Modals */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center;
            backdrop-filter: blur(8px);
        }
        .modal-content {
            background: #282828; padding: 30px; border-radius: 12px; max-width: 380px; width: 90%;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-content h2 { margin: 0 0 10px 0; font-size: 1.4em; color: var(--primary); }
        .modal-content p { color: var(--sub); line-height: 1.4; margin-bottom: 25px; font-size: 0.95em; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-m { padding: 12px 24px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9em; }
        .btn-m-confirm { background: var(--primary); color: black; }
        .btn-m-cancel { background: transparent; color: white; border: 1px solid #555; }

        /* Undo Toast */
        #undo-toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(150px);
            background: #282828; color: white; min-width: 320px; padding: 12px 20px;
            border-radius: 8px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 3000; transition: transform 0.3s ease;
            overflow: hidden; 
        }
        #undo-toast.active { transform: translateX(-50%) translateY(0); }
        .toast-left { display: flex; align-items: center; gap: 10px; }
        #undo-btn { color: var(--primary); background: none; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.85em; }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--primary); width: 100%; }

        .archive-collapsed {
            max-height: 150px; 
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .archive-expanded {
            max-height: 2000px; 
            transition: max-height 0.6s ease-in-out;
        }

        #liked-songs-container .action-btn:first-child {
            display: none !important;
        }

        .removing-card {
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.4s ease;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .new-track { animation: slideIn 0.4s ease-out; }
    </style>
</head>
<body>

<div class="container">
    <div class="auth-banner">
        <div class="auth-status-info">
            <div id="auth-dot" class="status-dot"></div>
            <span id="user-info">Authenticating...</span>
        </div>
        <button id="auth-btn" class="auth-btn" onclick="handleAuthClick()">Login with Spotify</button>
    </div>

    <div class="dashboard">
        <h3 style="margin-top:0">📅 My Routine</h3>
        <div class="schedule-grid">
            <div class="slot-control">
                <label>Morning</label>
                <select id="morning"><option value="relax">Relax</option><option value="study">Study</option><option value="gym">Gym</option><option value="commute">Commute</option></select>
            </div>
            <div class="slot-control">
                <label>Afternoon</label>
                <select id="afternoon"><option value="relax">Relax</option><option value="study">Study</option><option value="gym">Gym</option><option value="commute">Commute</option></select>
            </div>
            <div class="slot-control">
                <label>Evening</label>
                <select id="evening"><option value="relax">Relax</option><option value="study">Study</option><option value="gym">Gym</option><option value="commute">Commute</option></select>
            </div>
        </div>
        <button class="btn-save" onclick="saveSchedule()">Update Routine</button>
    </div>

    <h3 style="margin-bottom:10px">Manual Switch</h3>
    <div class="quick-switch">
        <button class="mode-btn" onclick="manualSwitch('study', this)">📚 Study</button>
        <button class="mode-btn" onclick="manualSwitch('gym', this)">💪 Gym</button>
        <button class="mode-btn" onclick="manualSwitch('relax', this)">☕ Relax</button>
        <button class="mode-btn" onclick="manualSwitch('commute', this)">🚗 Commute</button>
    </div>

    <div class="dashboard" id="liked-songs-section" style="display: none; background: #121212; border: 1px solid rgba(255, 255, 255, 0.05); margin-top: 30px; border-radius: 12px; padding: 24px;">
        <div style="margin-top: 0; margin-bottom: 20px; color: #ffffff; font-size: 0.9rem; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; display: flex; justify-content: space-between; align-items: center;">
            <span>Sonic Archives</span>
            <span id="archive-count" style="color: #666; font-size: 0.7rem; letter-spacing: 1px;">0 ITEMS</span>
        </div>
        
        <div id="liked-songs-container" class="track-list archive-collapsed">
            </div>

        <button id="toggle-archive-btn" onclick="toggleArchiveView()" style="display: none; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #b3b3b3; width: 100%; padding: 10px; margin-top: 15px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s;">
            Expand Library
        </button>
    </div>

    <div class="status-header">
        <span id="status-text" class="status-text">Ready</span>
        <span style="font-size:0.8em; color:#666" id="source-text"></span>
    </div>
    <div id="track-container" class="track-list"></div>
</div>

<div id="login-reminder-modal" class="modal-overlay">
    <div class="modal-content">
        <h2>Save Your Vibe!</h2>
        <p>Login with Spotify to save your liked artists and permanently blacklist tracks from your routine.</p>
        <div class="modal-actions">
            <button class="btn-m btn-m-confirm" onclick="window.location.href='/login'">Login with Spotify</button>
            <button class="btn-m btn-m-cancel" onclick="closeLoginModal()">Maybe Later</button>
        </div>
    </div>
</div>

<div id="dislike-modal" class="modal-overlay">
    <div class="modal-content">
        <h2>Remove this Track?</h2> 
        <p>
            We'll hide <b id="modal-track-name"></b> from your <span id="modal-activity-name"></span> sessions.
            <span id="modal-artist-name" style="display: none;"></span>
        </p>
        <div class="modal-actions">
            <button id="modal-confirm-btn" class="btn-m btn-m-confirm" style="background: #ff4444; color: white;">Confirm Mute</button>
            <button class="btn-m btn-m-cancel" onclick="closeDislikeModal()">Keep it</button>
        </div>
    </div>
</div>

<div id="undo-toast">
    <div class="toast-left">
        <span>Track removed.</span>
        <button id="undo-btn" onclick="restoreTrack()">Undo</button>
    </div>
    <div class="toast-progress" id="toast-bar"></div>
</div>

<script>
    let currentActivity = '';
    let pendingDislike = null; 
    let backupTrack = null; 
    let undoTimeout = null;
    let isLoggedInGlobal = false;
    let isArchiveExpanded = false;

    window.onload = async () => {
        await loadSchedule();
        fetchMusic(null);
        refreshLikedSongs();
    };

    // --- Auth UI Logic ---
    function updateAuthUI(isLoggedIn) {
        isLoggedInGlobal = isLoggedIn;
        const btn = document.getElementById('auth-btn');
        const info = document.getElementById('user-info');
        const dot = document.getElementById('auth-dot');
        
        if (isLoggedIn) {
            info.innerText = "Spotify Connected";
            dot.className = "status-dot online";
            btn.innerText = "Logout";
            btn.classList.add('btn-m-cancel');
        } else {
            info.innerText = "Guest Mode";
            dot.className = "status-dot offline";
            btn.innerText = "Login Spotify";
        }
    }

    function handleAuthClick() {
        if (isLoggedInGlobal) {
            if(confirm("Are you sure you want to log out?")) window.location.href = '/logout';
        } else {
            window.location.href = '/login';
        }
    }

    function closeLoginModal() { document.getElementById('login-reminder-modal').style.display = 'none'; }

    // --- Core Functions ---
    async function loadSchedule() {
        try {
            const res = await fetch('/get_schedule');
            const data = await res.json();
            if (data.morning) document.getElementById('morning').value = data.morning;
            if (data.afternoon) document.getElementById('afternoon').value = data.afternoon;
            if (data.evening) document.getElementById('evening').value = data.evening;
        } catch(e) {}
    }

    async function saveSchedule() {
        const schedule = { 
            morning: document.getElementById('morning').value, 
            afternoon: document.getElementById('afternoon').value, 
            evening: document.getElementById('evening').value 
        };
        await fetch('/save_schedule', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify(schedule) 
        });
        alert('✅ Schedule Sync Complete!');
        fetchMusic(null);
    }

    function manualSwitch(mode, btn) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        fetchMusic(mode);
    }

async function fetchMusic(overrideMode) {
        const container = document.getElementById('track-container');
        container.innerHTML = '<p style="text-align:center; color:#666">Connecting to Mars Radio...</p>';
        try {
            const res = await fetch('/get_music', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ override: overrideMode }) 
            });
            const data = await res.json();
            
            // 1. 立即同步全局登录变量
            isLoggedInGlobal = data.is_logged_in; 
            
            // 2. 更新 UI 状态
            updateAuthUI(data.is_logged_in);
            
            // 3. ✨ 关键点：只有确认登录状态同步后，才去刷新收藏夹
            if (isLoggedInGlobal) {
                console.log("Login confirmed, syncing collection...");
                refreshLikedSongs(); 
            }

            currentActivity = data.activity;
            document.getElementById('status-text').innerText = data.activity;
            document.getElementById('source-text').innerText = `Via ${data.source}`;
            container.innerHTML = '';
            
            if (data.tracks && data.tracks.length > 0) {
                data.tracks.forEach(t => container.appendChild(createTrackCard(t)));
            } else {
                container.innerHTML = '<p style="text-align:center; color:#666">No tracks found for this activity.</p>';
            }
        } catch(e) { 
            console.error("Fetch music error:", e);
            container.innerHTML = '<p style="color:red; text-align:center">Failed to fetch music.</p>'; 
        }
    }

        function createTrackCard(t) {
            const div = document.createElement('div');
            div.className = 'track-card new-track';
            div.id = `card-${t.id}`;
            
            const likedClass = t.is_liked ? 'liked' : '';

            div.innerHTML = `
                <img src="${t.image}" class="album-art">
                <div class="track-info">
                    <div class="track-title">${t.name}</div>
                    <div class="track-artist">${t.artist}</div>
                </div>
                <div class="actions">
                    <button class="action-btn" onclick="handleDislikeClick('${t.id}', '${t.artist}', '${t.name.replace(/'/g, "\\'")}')">👎</button>
                    <button class="action-btn btn-like ${likedClass}" onclick="handleLike('${t.id}', '${t.artist}', this)">❤️</button>
                    <button class="action-btn btn-play" onclick="window.open('${t.link}', '_blank')">▶</button>
                </div>
            `;
            return div;
        }

        
        async function refreshLikedSongs() {
            const section = document.getElementById('liked-songs-section');
            const container = document.getElementById('liked-songs-container');
            const toggleBtn = document.getElementById('toggle-archive-btn');
            const countSpan = document.getElementById('archive-count');
            
            if (!section || !container) return;

            if (!isLoggedInGlobal) {
                section.style.display = 'none';
                return;
            }

            try {
                const res = await fetch('/get_liked_songs');
                const songs = await res.json();

                if (Array.isArray(songs) && songs.length > 0) {
                    section.style.display = 'block';
                    countSpan.innerText = `${songs.length} ITEMS`;
                    container.innerHTML = '';
                    
                    songs.forEach(s => {
                        // 1. 生成卡片
                        const card = createTrackCard({...s, is_liked: true});
                        
                        // 2. 这里的修改很关键：为了和主列表区分，我们给 Archives 里的卡片加个特殊的 ID 
                        // 这样 handleLike 就能识别出是从这里触发的，并执行移除动画
                        card.id = `archive-card-${s.id}`; 
                        
                        card.style.background = 'rgba(255,255,255,0.02)';
                        card.style.border = 'none';
                        container.appendChild(card);
                    });

                    // 控制展开逻辑
                    if (songs.length > 2) {
                        toggleBtn.style.display = 'block';
                        toggleBtn.innerText = isArchiveExpanded ? "Collapse Archives" : `View All (${songs.length})`;
                        // 只有在没展开时才加折叠类
                        if (!isArchiveExpanded) container.classList.add('archive-collapsed');
                    } else {
                        toggleBtn.style.display = 'none';
                        container.classList.remove('archive-collapsed');
                    }
                } else {
                    section.style.display = 'none';
                }
            } catch (e) {
                console.error("Refresh failed:", e);
            }
        }

        // 控制展开与收起的函数
        function toggleArchiveView() {
            const container = document.getElementById('liked-songs-container');
            const toggleBtn = document.getElementById('toggle-archive-btn');
            
            isArchiveExpanded = !isArchiveExpanded;
            
            if (isArchiveExpanded) {
                container.classList.remove('archive-collapsed');
                container.classList.add('archive-expanded');
                toggleBtn.innerText = "Collapse Archives";
            } else {
                container.classList.remove('archive-expanded');
                container.classList.add('archive-collapsed');
                toggleBtn.innerText = "View All Library";
            }
        }

    async function handleLike(tid, artist, btn) {
        if (!isLoggedInGlobal) {
            document.getElementById('login-reminder-modal').style.display = 'flex';
            return;
        }

        // 立即给按钮一个反馈，防止连点
        btn.style.pointerEvents = 'none';

        try {
            const res = await fetch('/toggle_like', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ 
                    track_id: tid, 
                    artist: artist, 
                    activity: currentActivity 
                }) 
            });
            
            const result = await res.json();
            
            // 判断是否在档案库容器内
            const isInArchive = btn.closest('#liked-songs-container') !== null;

            if (result.status === 'removed') {
                if (isInArchive) {
                    // 如果是在档案库点灭红心：触发消失动画
                    const card = btn.closest('.track-card');
                    card.classList.add('removing-card');
                    
                    setTimeout(() => {
                        refreshLikedSongs(); // 动画结束后重新渲染列表（更新计数和高度）
                    }, 400);
                } else {
                    // 如果在主推荐列表点灭：仅切换状态并同步档案库
                    btn.classList.remove('liked');
                    refreshLikedSongs();
                }
            } else {
                // 添加成功
                btn.classList.add('liked');
                refreshLikedSongs();
            }
        } catch (e) {
            console.error("Like toggle failed", e);
        } finally {
            btn.style.pointerEvents = 'auto';
        }
    }


function handleDislikeClick(tid, artist, trackName) {
    if (!isLoggedInGlobal) {
        document.getElementById('login-reminder-modal').style.display = 'flex';
        return;
    }
    
    pendingDislike = { tid, artist, trackName };
    
    if(document.getElementById('modal-track-name')) {
        document.getElementById('modal-track-name').innerText = trackName;
    }
    if(document.getElementById('modal-activity-name')) {
        document.getElementById('modal-activity-name').innerText = "playlist";
    }

    document.getElementById('dislike-modal').style.display = 'flex';

    document.getElementById('modal-confirm-btn').onclick = optimisticDelete;
}

    function closeDislikeModal() { document.getElementById('dislike-modal').style.display = 'none'; }

async function optimisticDelete() {
    if(!pendingDislike) return;
    const { tid, artist, trackName } = pendingDislike; 
    
    const card = document.getElementById(`card-${tid}`);
    
    backupTrack = { tid: tid, html: card.outerHTML, parent: card.parentNode, nextSibling: card.nextSibling };
    card.remove();
    closeDislikeModal();

    const toast = document.getElementById('undo-toast');
    const bar = document.getElementById('toast-bar');
    toast.classList.add('active');
    bar.style.transition = 'none'; bar.style.width = '100%';
    setTimeout(() => { bar.style.transition = 'width 5s linear'; bar.style.width = '0%'; }, 10);

    fetch('/dislike_song', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ 
            track_id: tid, 
            name: trackName, 
            artist: artist, 
            activity: currentActivity 
        })
    });

    if(undoTimeout) clearTimeout(undoTimeout);
    undoTimeout = setTimeout(() => hideToast(), 5000);
}

    function restoreTrack() {
        if(!backupTrack) return;
        const { html, parent, nextSibling } = backupTrack;
        const temp = document.createElement('div'); temp.innerHTML = html;
        const restoredCard = temp.firstChild;
        if (nextSibling && nextSibling.parentNode) parent.insertBefore(restoredCard, nextSibling);
        else parent.appendChild(restoredCard);
        hideToast();
    }

    function hideToast() {
        document.getElementById('undo-toast').classList.remove('active');
        backupTrack = null;
        if(undoTimeout) clearTimeout(undoTimeout);
    }
</script>

</body>
</html>
